<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Địa Bạ - Maps Profiler</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      color: #1e293b;
      background: #f8fafc;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 10px;
    }
    h1 { font-size: 15px; font-weight: 700; color: #0f172a; }
    .badge {
      font-size: 11px;
      background: #ecfdf5;
      color: #059669;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    .group {
      margin-bottom: 12px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
    }
    .group-title {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .checkbox-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    button.primary {
      width: 100%;
      background: #0f766e;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button.primary:hover { background: #115e59; }
    button.primary:disabled { background: #94a3b8; cursor: not-allowed; }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #475569;
      min-height: 18px;
    }
    #resultBox {
      display: none;
      margin-top: 12px;
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      font-family: monospace;
      font-size: 11px;
      max-height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    footer {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }
    footer a { color: #0f766e; text-decoration: none; cursor: pointer; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <h1>Địa Bạ Maps Profiler</h1>
    <span class="badge">v1.0.0</span>
  </header>

  <div class="group">
    <div class="group-title">Mục cần thu thập</div>
    <div class="checkbox-row">
      <label><input type="checkbox" id="chkMenu" checked> Menu chữ (Thực đơn)</label>
      <label><input type="checkbox" id="chkAttributes" checked> Tiện ích & dịch vụ (About)</label>
      <label><input type="checkbox" id="chkSpecialHours" checked> Giờ đặc biệt (Special hours)</label>
    </div>
  </div>

  <button id="btnCollect" class="primary">Thu thập trang Maps hiện tại</button>
  <div id="status"></div>
  <pre id="resultBox"></pre>

  <footer>
    <span style="color: #64748b;">Dành cho Sale GoDine</span>
    <a id="lnkOptions">Cài đặt AI Gateway ⚙️</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
